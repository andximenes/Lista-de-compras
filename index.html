<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lista de compras</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/index.css">
</head>

<body>

    <main class="container">

        <h1 class="title">Weekly shopping</h1>

        <div class="add-item">
            <input type="text" id="input" placeholder="add a new item">
            <button type="button" id="addButton" class="input-button">Add item</button>
        </div>

        <ul id="shopping-list"></ul>
        
        <div class="alert hide">
            <img src="/assets/warning-circle-filled.png" alt="">
            <span id="msg">Item removed from the list</span>
        </div>
    </main>
    <script src="/js/inde.js"></script>
</body>
</html>
